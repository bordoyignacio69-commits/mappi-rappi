<!doctype html>
<!--
  MAPPI + Radar · prototipo académico (UDD) para Rappi
  ==================================================================
  index.html = ESTRUCTURA. Aquí están los bloques fijos de la página:
    - la barra superior (selector de vistas)
    - la carcasa del iPhone (isla, barra de estado, pantalla, menú inferior)
    - el panel guía, la vista "Conectado" y el panel Radar
  El contenido de cada bloque lo dibuja JavaScript (carpeta js/) y la
  apariencia está en css/styles.css.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MAPPI · Rappi</title>
  <meta name="description" content="Prototipo académico de MAPPI (recomendaciones de personas afines dentro de Rappi) y Radar (panel interno para el equipo de Rappi). Datos ficticios.">

  <!-- Para que se vea como app al abrirlo desde el celular -->
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MAPPI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon-180.png">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400..600&display=swap">

  <!-- Mapa real (Leaflet + OpenStreetMap). Si configuras una clave de Google Maps en js/config.js se usa Google Maps -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

  <!-- APARIENCIA -->
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>

<body class="theme-mappi">

  <!-- ============ Barra superior (solo en computador) ============ -->
  <header class="topbar wrap-x" id="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div>
        <div class="brand-name">MAPPI <span class="brand-by">by Rappi</span></div>
        <div class="brand-sub">Prototipo académico UDD · Equipo McFlurry</div>
      </div>
    </div>
    <div class="switch" role="group" aria-label="Elegir vista">
      <button data-a="view" data-v="mappi">MAPPI · usuario</button>
      <button data-a="view" data-v="conectado">Conectado</button>
      <button data-a="view" data-v="radar">Radar · equipo Rappi</button>
    </div>
    <div class="top-right">
      <button class="ghost" data-a="openCmd" aria-label="Buscar aliados, páginas y acciones">Buscar <kbd>⌘K</kbd></button>
      <span class="pill-note">Datos ficticios</span>
      <button class="ghost" data-a="reset">Reiniciar</button>
    </div>
  </header>

  <!-- ============ Contenido principal ============ -->
  <main class="layout wrap-x" id="main" data-view="mappi">

    <!-- Carcasa de iPhone. En un celular real la carcasa desaparece y la app ocupa toda la pantalla -->
    <div class="device" id="device">
      <div class="phone theme-mappi" id="phone" aria-label="Pantalla de MAPPI">
        <div class="island" aria-hidden="true"></div>
        <div class="statusbar" aria-hidden="true">
          <span class="sb-time" id="sb-time">9:41</span>
          <span class="sb-icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .8 10.4 10.4 0 0 0 .8 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4.4 6.7 6.7 0 0 0 3.4 6.2l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c.5 0 1 .2 1.3.5L8 11.6 6.7 10.2c.3-.3.8-.5 1.3-.5Z"/></svg>
            <span class="sb-batt"><i></i></span>
          </span>
        </div>
        <!-- La pantalla: aquí JavaScript dibuja cada vista de Rappi/MAPPI -->
        <div class="screen" id="screen"></div>
        <!-- Aviso breve (toast) -->
        <div id="ptoast"></div>
        <!-- Menú inferior -->
        <nav class="bnav" id="bnav" aria-label="Navegación de la app"></nav>
        <!-- Hoja inferior (explicación de monedas, etc.) -->
        <div id="psheet"></div>
        <div class="home-ind" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Panel guía junto al teléfono (vista MAPPI) -->
    <aside class="guide" id="guide"></aside>

    <!-- Vista "Conectado": cómo cada acción llega a Radar -->
    <section class="conn-panels" id="conn" aria-label="Flujo conectado"></section>

    <!-- Radar: panel interno del equipo Rappi (fuera de la app) -->
    <section class="theme-radar radar-wrap" id="radar" aria-label="Radar"></section>
  </main>

  <!-- Capas flotantes: avisos, paleta de comandos, exportar -->
  <div id="overlays"></div>

  <noscript><p style="padding:24px">Este prototipo necesita JavaScript para funcionar.</p></noscript>

  <!-- ============ COMPORTAMIENTO (JavaScript) ============
       El orden importa: primero librerías y datos, después la lógica y al final app.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/config.js?v=3"></script>   <!-- ajustes: clave de Google Maps, ubicación simulada -->
  <script src="js/data.js?v=3"></script>     <!-- base de datos simulada -->
  <script src="js/icons.js?v=3"></script>    <!-- íconos SVG -->
  <script src="js/util.js?v=3"></script>     <!-- utilidades pequeñas -->
  <script src="js/db.js?v=3"></script>       <!-- guarda y lee la base (localStorage) -->
  <script src="js/engine.js?v=3"></script>   <!-- motor de señales y puntajes de Radar -->
  <script src="js/domain.js?v=3"></script>   <!-- reglas del negocio: pedidos, opiniones, monedas -->
  <script src="js/map.js?v=3"></script>      <!-- mapa real (Leaflet o Google Maps) -->
  <script src="js/mappi.js?v=3"></script>    <!-- pantallas de Rappi y MAPPI -->
  <script src="js/radar.js?v=3"></script>    <!-- pantallas de Radar -->
  <script src="js/app.js?v=3"></script>      <!-- estado, acciones, animaciones y arranque -->
</body>
</html>
